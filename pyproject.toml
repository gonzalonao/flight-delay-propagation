[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-propagation"
version = "0.1.0"
description = "Predictive modeling of flight delay propagation using spatio-temporal GNNs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Gonzalo López Crespo"},
]
dependencies = [
    "torch>=2.1",
    "torch-geometric>=2.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "ruff>=0.3",
]
# Azure deployment dependencies — not installed by default to keep the
# research environment clean. Used by Azure Functions, AzureML jobs,
# and the Fabric notebooks.
deploy = [
    "azure-storage-file-datalake>=12.0",
    "azure-identity>=1.15",
    "azure-ai-ml>=1.12",
    "deltalake>=0.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.uv.sources]
torch = [{index = "pytorch-cu128"}]
torchvision = [{index = "pytorch-cu128"}]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py310"
# Jupyter/Fabric notebooks are platform artifacts that must round-trip through
# Fabric's import API unchanged; reformatting them risks invalidating the .ipynb
# (e.g. cell-id requirements) and adds noise. Lint/format only the .py sources.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
