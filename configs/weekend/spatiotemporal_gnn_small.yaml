# =============================================================================
# Weekend run — SpatioTemporalGNN (small / baseline)
# =============================================================================
# Variante "small": replica configs/spatiotemporal_gnn.yaml con dos cambios:
#   - graph.temporal_window_hours: 2 → 1
#   - weather.enabled: false → true
# Capacidad: gnn_hidden=64, lstm_hidden=128, num_heads=4, num_gnn_layers=2.
#
# Uso: python scripts/train.py --config configs/weekend/spatiotemporal_gnn_small.yaml

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]
  sample_frac: null
  random_seed: 42
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70
  min_route_flights: 30
  temporal_window_hours: 1
  input_window: 6
  prediction_horizons: [1, 2, 4, 6, 8]
  normalize_features: true

weather:
  enabled: true
  provider: open_meteo
  cache_dir: data/processed/weather
  params:
    - wind
    - precip_cloud
    - category

model:
  name: spatiotemporal_gnn
  spatiotemporal_gnn:
    gnn_hidden: 64
    lstm_hidden: 128
    num_heads: 4
    num_gnn_layers: 2
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  patience: 25
  gradient_clip: 1.0
  num_workers: 4
  loss: multi_task
  huber_delta: 10.0
  delay_weight: 2.0
  horizon_weights: [3, 3, 4, 5, 5]
  multi_task:
    main_weight: 1.0
    aux_weight: 0.3
    bce_weight: 0.5
    bce_pos_weight: null

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
