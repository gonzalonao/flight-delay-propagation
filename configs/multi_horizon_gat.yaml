# =============================================================================
# MultiHorizonGAT configuration - Multi-horizon prediction
# =============================================================================
# Usage: python scripts/train.py --config configs/multi_horizon_gat.yaml
#
# Changes from v1:
#   - sample_frac: 0.1 → 0.3 (more data to learn temporal patterns)
#   - temporal_window_hours: 1 → 2 (more flights per snapshot)
#   - normalize_features: true (zero-mean, unit-variance on node features)
#   - loss: weighted_huber (δ=10) with weight 2.0 (penalizes delays + tail-robust)
#   - learning_rate: 0.001 → 0.0005 (more stable for multi-head attention)
#   - epochs: 30 → 100, patience: 10 → 20 (more time to converge)
#   - Validation with standard (unweighted) MSE for comparable metrics

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]
  sample_frac: null
  random_seed: 42
  # See `configs/default.yaml` for the rationale of the Class A (schedule)
  # vs Class B (actuals) grouping and the note about BTS columns.
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70
  min_route_flights: 30
  temporal_window_hours: 2
  input_window: 6
  prediction_horizons: [1, 2, 4, 6, 8]
  normalize_features: true

model:
  name: multi_horizon_gat
  multi_horizon_gat:
    hidden_channels: 64
    num_heads: 4
    num_layers: 3
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.0005
  weight_decay: 0.0001
  scheduler: cosine
  patience: 20
  gradient_clip: 1.0
  num_workers: 4
  # W2: multi-task loss (ArrDelay regression + auxiliary DepDelay regression
  # + BCE classification of pct_arr_delayed_15). The factory sees this loss
  # and builds the model with output_channels=3 automatically.
  loss: multi_task
  huber_delta: 10.0                 # MSE→MAE transition at ±10 min in both regressions
  delay_weight: 2.0
  horizon_weights: [3, 3, 4, 5, 5]  # Favors business horizons (4-8 h)
  multi_task:
    main_weight: 1.0   # Huber on ArrDelay (channel 0) — primary target
    aux_weight: 0.3    # Huber on DepDelay aux (channel 1) — regularizer
    bce_weight: 0.5    # BCE on pct_arr_delayed_15 (channel 2) — Precision/Recall/F1
    bce_pos_weight: null  # raise (e.g. 2.0) if recall stays well below precision

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
