# =============================================================================
# Configuración BasicGCN - Test rápido de accuracy
# =============================================================================
# Uso: python scripts/train.py --config configs/basic_gcn.yaml

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018]
  sample_frac: 0.1
  random_seed: 42
  # Ver `configs/default.yaml` para la justificación del agrupamiento
  # Class A (schedule) vs Class B (actuals) y la nota sobre BTS.
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_months: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  val_months: [10, 11]
  test_months: [12]

graph:
  top_n_airports: 30
  min_route_flights: 50
  temporal_window_hours: 1
  input_window: 6
  prediction_horizons: [1, 2, 3, 4, 5]

model:
  name: basic_gcn
  basic_gcn:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.3

training:
  epochs: 30
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  patience: 10
  gradient_clip: 1.0
  num_workers: 4

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
