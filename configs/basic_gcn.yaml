# =============================================================================
# BasicGCN configuration - Quick accuracy test
# =============================================================================
# Usage: python scripts/train.py --config configs/basic_gcn.yaml

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]
  sample_frac: null
  random_seed: 42
  # See `configs/default.yaml` for the rationale of the Class A (schedule)
  # vs Class B (actuals) grouping and the note about BTS columns.
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70
  min_route_flights: 30
  temporal_window_hours: 1
  input_window: 6
  prediction_horizons: [1, 2, 4, 6, 8]

model:
  name: basic_gcn
  basic_gcn:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.3

training:
  epochs: 30
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  patience: 10
  gradient_clip: 1.0
  num_workers: 4

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
