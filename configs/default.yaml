# =============================================================================
# Configuración por defecto - Flight Delay Propagation
# =============================================================================

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]            # Dos años completos cubren ~14M vuelos
  sample_frac: null              # Sin muestreo: usa el dataset completo
  random_seed: 42
  # Columnas relevantes del dataset de Kaggle (Combined_Flights, BTS On-Time).
  # Agrupadas por disponibilidad temporal — ver `src/data/loader.py` y la
  # invariante de leakage en `src/data/graph_builder.py`.
  # Nota: algunos Parquets (sobre todo años antiguos) no contienen las
  # columnas BTS de causa de retraso. `load_parquet` ignora silenciosamente
  # las columnas ausentes y avisa por log; los modelos deben tolerar
  # ausencia rellenando con 0 vía `fill_delay_nulls`.
  columns:
    # Identificadores y schedule (Class A — known a priori)
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    # Actuales (Class B — solo válidas para ventanas de input históricas)
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    # Descomposición BTS de causas (Class B)
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal               # Separación temporal cronológica
  # Cortes por fecha ISO (preferido cuando hay varios años). Cubre
  # 2018-01-01 → 2019-12-31: ~75% train, ~12% val, ~13% test.
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70             # ~95% de las salidas de pasajeros en EE.UU.
  min_route_flights: 30          # Permite rutas menos densas para grafo más rico
  temporal_window_hours: 1       # Resolución temporal de los snapshots
  input_window: 6                # Horas de historia como input
  prediction_horizons: [1, 2, 4, 6, 8]  # Horas futuras (h=4/6/8 son los objetivos de negocio)
  cache_dir: data/processed/snapshots   # Caché de snapshots; null para desactivar

# =============================================================================
# Meteorología (bloque H de features de nodo, opcional)
# =============================================================================
# Cuando ``enabled: true`` el builder llama a Open-Meteo Historical (ERA5)
# para cada aeropuerto en ``airports`` y añade 9 + 9·len(prediction_horizons)
# features por nodo:
#   Histórico (sobre la ventana de input):
#     mean wind_speed_10m, max wind_gusts_10m, sum precipitation,
#     mean cloud_cover, one-hot de la categoría WMO dominante (5 clases).
#   Futuro (por horizonte, observación a T + (h-0.5)·W):
#     wind_speed, gust, precip, cloud, one-hot de la categoría observada.
#
# Coordenadas: ``src/data/reference/airport_coords.csv`` (top-70 EE.UU.).
# Aeropuertos sin entrada se omiten con warning — sus features quedan a 0
# (no-señal), el entrenamiento NO se rompe.
#
# Cache HTTP en disco: un parquet por (iata, start_date, end_date) bajo
# ``cache_dir``. La caché evita repetir descargas entre runs y entre
# splits train/val/test.
#
# Toggle de grupos (para ablaciones individuales, ver OPTIMIZATIONS.md):
#   - wind            → mean wind + max gust
#   - precip_cloud    → sum precip + mean cloud cover
#   - category        → one-hot de categoría WMO (clear/fog/rain/snow/thunder)
weather:
  enabled: false                 # off por defecto: el primer run sin red sigue funcionando
  provider: open_meteo           # único valor soportado de momento
  cache_dir: data/processed/weather
  params:
    - wind
    - precip_cloud
    - category

model:
  name: dense_nn                 # dense_nn | lstm | basic_gcn | multi_horizon_gat | spatiotemporal_gnn | seq2seq_gnn
  dense_nn:
    hidden_dims: [256, 128, 64]
    dropout: 0.3
    activation: relu
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
    sequence_length: 12
  basic_gcn:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.3
  multi_horizon_gat:
    hidden_channels: 64
    num_heads: 4
    num_layers: 3
    dropout: 0.3
  spatiotemporal_gnn:
    gnn_hidden: 64
    lstm_hidden: 128
    num_heads: 4
    num_gnn_layers: 2
    dropout: 0.3
  seq2seq_gnn:
    # Spatio-Temporal Transformer redesigned in W3:
    #   - GAT spatial encoder con residuales pre-norm + GELU
    #   - Transformer temporal encoder (sustituye al LSTM)
    #   - Decoder de queries por horizonte (sin teacher forcing)
    # ``hidden_dim`` debe ser divisible por ``num_heads``.
    hidden_dim: 128
    num_heads: 4
    num_spatial_layers: 3
    num_temporal_layers: 2
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine              # cosine | step | plateau
  patience: 15                   # Early stopping
  gradient_clip: 1.0
  num_workers: 4
  device: auto                   # auto | cuda | cpu — ver GPU_SETUP.md.
                                 # 'cuda' falla duro si no hay GPU disponible
                                 # (recomendado para evitar runs en CPU
                                 # silenciosos). 'auto' cae a CPU con warning.
  # Soportadas: mse | weighted_mse | weighted_huber | multi_task.
  # ``multi_task`` (W2) sólo tiene efecto en multi_horizon_gat,
  # spatiotemporal_gnn y seq2seq_gnn — el factory los crea con
  # output_channels=3 al verla. Para baselines (DenseNN, BasicGCN) usa
  # mse o weighted_huber.
  # loss: multi_task
  multi_task:
    main_weight: 1.0   # Huber sobre ArrDelay (canal 0) — target principal
    aux_weight: 0.3    # Huber sobre DepDelay aux (canal 1) — regularizador
    bce_weight: 0.5    # BCE sobre pct_arr_delayed_15 (canal 2) — Precision/Recall/F1
    bce_pos_weight: null  # subir (e.g. 2.0) si recall queda por debajo de precision

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15    # Umbral para clasificación binaria

# =============================================================================
# Export para Power BI (scripts/export_powerbi.py)
# =============================================================================
# Genera el esquema en estrella bajo ``out_dir`` (dim_airport, dim_date,
# dim_hour, fact_airport_hour, agg_baseline_volume, agg_* y fact_predictions).
# ``seats_per_flight`` habilita columnas de pasajeros ESTIMADOS (proxy =
# vuelos x asientos); ponlo a null/0 para omitirlas. El dataset no contiene
# conteos reales de pasajeros — es flight-level — por eso es una estimación.
powerbi:
  out_dir: outputs/powerbi
  seats_per_flight: 130          # estimación media US doméstico; null/0 = omitir
  prediction_split: test         # split temporal a predecir para fact_predictions

reproducibility:
  seed: 42
  deterministic: true
