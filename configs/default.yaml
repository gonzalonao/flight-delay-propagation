# =============================================================================
# Default configuration - Flight Delay Propagation
# =============================================================================

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]            # Two full years cover ~14M flights
  sample_frac: null              # No sampling: use the full dataset
  random_seed: 42
  # Relevant columns from the Kaggle dataset (Combined_Flights, BTS On-Time).
  # Grouped by temporal availability — see `src/data/loader.py` and the
  # leakage invariant in `src/data/graph_builder.py`.
  # Note: some Parquet files (especially older years) do not contain the
  # BTS delay-cause columns. `load_parquet` silently ignores missing
  # columns and logs a warning; models must tolerate their absence by
  # filling with 0 via `fill_delay_nulls`.
  columns:
    # Identifiers and schedule (Class A — known a priori)
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    # Actuals (Class B — only valid for historical input windows)
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    # BTS delay-cause breakdown (Class B)
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal               # Chronological temporal split
  # ISO date cutoffs (preferred when spanning several years). Covers
  # 2018-01-01 → 2019-12-31: ~75% train, ~12% val, ~13% test.
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70             # ~95% of U.S. passenger departures
  min_route_flights: 30          # Allows less dense routes for a richer graph
  temporal_window_hours: 1       # Temporal resolution of the snapshots
  input_window: 6                # Hours of history used as input
  prediction_horizons: [1, 2, 4, 6, 8]  # Future hours (h=4/6/8 are the business targets)
  cache_dir: data/processed/snapshots   # Snapshot cache; null to disable

# =============================================================================
# Weather (node-feature block H, optional)
# =============================================================================
# When ``enabled: true`` the builder calls Open-Meteo Historical (ERA5)
# for each airport in ``airports`` and adds 9 + 9·len(prediction_horizons)
# features per node:
#   Historical (over the input window):
#     mean wind_speed_10m, max wind_gusts_10m, sum precipitation,
#     mean cloud_cover, one-hot of the dominant WMO category (5 classes).
#   Future (per horizon, observation at T + (h-0.5)·W):
#     wind_speed, gust, precip, cloud, one-hot of the observed category.
#
# Coordinates: ``src/data/reference/airport_coords.csv`` (top-70 U.S.).
# Airports without an entry are skipped with a warning — their features
# stay at 0 (no signal), training does NOT break.
#
# On-disk HTTP cache: one parquet per (iata, start_date, end_date) under
# ``cache_dir``. The cache avoids repeating downloads between runs and
# across train/val/test splits.
#
# Group toggles (for individual ablations, see docs/ablation-log.md):
#   - wind            → mean wind + max gust
#   - precip_cloud    → sum precip + mean cloud cover
#   - category        → one-hot WMO category (clear/fog/rain/snow/thunder)
weather:
  enabled: false                 # off by default: the first network-free run still works
  provider: open_meteo           # only supported value for now
  cache_dir: data/processed/weather
  params:
    - wind
    - precip_cloud
    - category

model:
  name: dense_nn                 # dense_nn | lstm | basic_gcn | multi_horizon_gat | spatiotemporal_gnn | seq2seq_gnn
  dense_nn:
    hidden_dims: [256, 128, 64]
    dropout: 0.3
    activation: relu
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
    sequence_length: 12
  basic_gcn:
    hidden_channels: 64
    num_layers: 3
    dropout: 0.3
  multi_horizon_gat:
    hidden_channels: 64
    num_heads: 4
    num_layers: 3
    dropout: 0.3
  spatiotemporal_gnn:
    gnn_hidden: 64
    lstm_hidden: 128
    num_heads: 4
    num_gnn_layers: 2
    dropout: 0.3
  seq2seq_gnn:
    # Spatio-Temporal Transformer redesigned in W3:
    #   - GAT spatial encoder with pre-norm residuals + GELU
    #   - Transformer temporal encoder (replaces the LSTM)
    #   - Per-horizon query decoder (no teacher forcing)
    # ``hidden_dim`` must be divisible by ``num_heads``.
    hidden_dim: 128
    num_heads: 4
    num_spatial_layers: 3
    num_temporal_layers: 2
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine              # cosine | step | plateau
  patience: 15                   # Early stopping
  gradient_clip: 1.0
  num_workers: 4
  device: auto                   # auto | cuda | cpu — see docs/gpu-setup.md.
                                 # 'cuda' fails hard if no GPU is available
                                 # (recommended to avoid silent CPU runs).
                                 # 'auto' falls back to CPU with a warning.
  # Supported: mse | weighted_mse | weighted_huber | multi_task.
  # ``multi_task`` (W2) only takes effect for multi_horizon_gat,
  # spatiotemporal_gnn and seq2seq_gnn — the factory builds them with
  # output_channels=3 when it sees it. For baselines (DenseNN, BasicGCN)
  # use mse or weighted_huber.
  # loss: multi_task
  multi_task:
    main_weight: 1.0   # Huber on ArrDelay (channel 0) — primary target
    aux_weight: 0.3    # Huber on DepDelay aux (channel 1) — regularizer
    bce_weight: 0.5    # BCE on pct_arr_delayed_15 (channel 2) — Precision/Recall/F1
    bce_pos_weight: null  # raise (e.g. 2.0) if recall stays below precision

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15    # Threshold for binary classification

# =============================================================================
# Power BI export (scripts/export_powerbi.py)
# =============================================================================
# Generates the star schema under ``out_dir`` (dim_airport, dim_date,
# dim_hour, fact_airport_hour, agg_baseline_volume, agg_* and fact_predictions).
# ``seats_per_flight`` enables ESTIMATED passenger columns (proxy =
# flights x seats); set it to null/0 to omit them. The dataset does not
# contain real passenger counts — it is flight-level — so this is an estimate.
powerbi:
  out_dir: outputs/powerbi
  seats_per_flight: 130          # average US domestic estimate; null/0 = omit
  prediction_split: test         # temporal split to predict for fact_predictions

reproducibility:
  seed: 42
  deterministic: true
