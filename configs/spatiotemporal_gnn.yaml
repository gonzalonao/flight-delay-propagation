# =============================================================================
# Configuración SpatioTemporalGNN - GAT + LSTM multi-horizonte
# =============================================================================
# Uso: python scripts/train.py --config configs/spatiotemporal_gnn.yaml
#
# Cambios respecto a multi_horizon_gat.yaml:
#   - model: spatiotemporal_gnn (GAT encoder + LSTM + MLP head)
#   - input_window: 6 (6 snapshots consecutivos como secuencia temporal)
#   - num_gnn_layers: 2 (menos que GAT puro; LSTM aporta capacidad temporal)
#   - lstm_hidden: 128 (dimensión del estado oculto LSTM)
#   - learning_rate: 0.0003 (menor para estabilidad del LSTM)
#   - patience: 25 (LSTM converge más lento)

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018]
  sample_frac: 0.3
  random_seed: 42
  # Ver `configs/default.yaml` para la justificación del agrupamiento
  # Class A (schedule) vs Class B (actuals) y la nota sobre BTS.
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_months: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  val_months: [10, 11]
  test_months: [12]

graph:
  top_n_airports: 30
  min_route_flights: 50
  temporal_window_hours: 2
  input_window: 6
  prediction_horizons: [1, 2, 3, 4, 5]
  normalize_features: true

model:
  name: spatiotemporal_gnn
  spatiotemporal_gnn:
    gnn_hidden: 64
    lstm_hidden: 128
    num_heads: 4
    num_gnn_layers: 2
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  patience: 25
  gradient_clip: 1.0
  num_workers: 4
  loss: weighted_mse
  delay_weight: 2.0
  horizon_weights: [5, 4, 3, 2, 1]

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
