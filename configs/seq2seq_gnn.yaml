# =============================================================================
# Seq2SeqGNN configuration - Spatio-Temporal Transformer + horizon-query decoder
# =============================================================================
# Usage: python scripts/train.py --config configs/seq2seq_gnn.yaml
#
# This configuration reflects the W3 workstream redesign:
#   - GATv2 spatial encoder with pre-norm residuals, LayerNorm and GELU.
#   - 2-layer Transformer temporal encoder with sinusoidal positional
#     encoding (replaces the LSTM).
#   - Decoder with per-horizon query embeddings that cross-attend to the
#     per-node temporal sequence. No teacher forcing and no autoregressive
#     decoding (the model is identical in train and eval except for dropout).
#
# Differences from spatiotemporal_gnn.yaml:
#   - model: seq2seq_gnn (per-horizon query decoder, not direct multi-output
#     from a single hidden state).
#   - No teacher forcing → no distribution shift between train and inference.
#   - slightly higher learning_rate for the MLP head, which starts from
#     queries with small init (std=0.02, BERT-style).

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]
  sample_frac: null
  random_seed: 42
  # See `configs/default.yaml` for the rationale of the Class A (schedule)
  # vs Class B (actuals) grouping and the note about BTS columns.
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70
  min_route_flights: 30
  temporal_window_hours: 2
  input_window: 6
  prediction_horizons: [1, 2, 4, 6, 8]
  normalize_features: true

model:
  name: seq2seq_gnn
  seq2seq_gnn:
    # ``hidden_dim`` is the embedding shared by the spatial encoder,
    # temporal encoder and decoder. Must be divisible by ``num_heads``.
    hidden_dim: 128
    num_heads: 4
    num_spatial_layers: 3   # GATv2 layers with pre-norm residuals
    num_temporal_layers: 2  # temporal Transformer layers
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.0005
  weight_decay: 0.0001
  scheduler: cosine
  patience: 25
  gradient_clip: 1.0
  num_workers: 4
  # W2: see multi_horizon_gat.yaml for an explanation of the loss.
  loss: multi_task
  huber_delta: 10.0
  delay_weight: 2.0
  horizon_weights: [3, 3, 4, 5, 5]  # Favors business horizons (4-8 h)
  multi_task:
    main_weight: 1.0
    aux_weight: 0.3
    bce_weight: 0.5
    bce_pos_weight: null

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
