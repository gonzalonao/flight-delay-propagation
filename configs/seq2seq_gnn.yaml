# =============================================================================
# Configuración Seq2SeqGNN - GAT + Encoder/Decoder LSTM (Strategy 3)
# =============================================================================
# Uso: python scripts/train.py --config configs/seq2seq_gnn.yaml
#
# Diferencias respecto a spatiotemporal_gnn.yaml:
#   - model: seq2seq_gnn (encoder-decoder, no direct multi-output)
#   - Teacher forcing durante entrenamiento, autoregresivo en inferencia
#   - Cabeza de salida por horizonte (separate Linear per step)
#   - learning_rate ligeramente mayor: el decoder step-by-step converge
#     más lento que el modelo directo, necesita más gradiente por época

data:
  raw_dir: data/raw
  processed_dir: data/processed
  years: [2018, 2019]
  sample_frac: null
  random_seed: 42
  # Ver `configs/default.yaml` para la justificación del agrupamiento
  # Class A (schedule) vs Class B (actuals) y la nota sobre BTS.
  columns:
    - FlightDate
    - Airline
    - Origin
    - Dest
    - CRSDepTime
    - CRSArrTime
    - CRSElapsedTime
    - Distance
    - Month
    - DayOfWeek
    - DayofMonth
    - Cancelled
    - Diverted
    - DepTime
    - ArrTime
    - DepDelay
    - ArrDelay
    - DepDel15
    - ArrDel15
    - WheelsOff
    - WheelsOn
    - TaxiOut
    - TaxiIn
    - AirTime
    - ActualElapsedTime
    - CarrierDelay
    - WeatherDelay
    - NASDelay
    - SecurityDelay
    - LateAircraftDelay

features:
  target: ArrDelay
  temporal:
    - month
    - day_of_week
    - hour
  categorical:
    - Airline
    - Origin
    - Dest
  numerical:
    - Distance
    - DepDelay
    - AirTime

split:
  method: temporal
  train_end: "2019-07-01"
  val_end:   "2019-10-01"

graph:
  top_n_airports: 70
  min_route_flights: 30
  temporal_window_hours: 2
  input_window: 6
  prediction_horizons: [1, 2, 4, 6, 8]
  normalize_features: true

model:
  name: seq2seq_gnn
  seq2seq_gnn:
    gnn_hidden: 64
    lstm_hidden: 128
    num_heads: 4
    num_gnn_layers: 2
    dropout: 0.3

training:
  epochs: 100
  batch_size: 512
  learning_rate: 0.0005
  weight_decay: 0.0001
  scheduler: cosine
  patience: 25
  gradient_clip: 1.0
  num_workers: 4
  loss: weighted_huber
  huber_delta: 10.0
  delay_weight: 2.0
  horizon_weights: [3, 3, 4, 5, 5]  # Favorece horizontes de negocio (4-8 h)

evaluation:
  metrics: [mae, rmse, mape, r2]
  delay_threshold_minutes: 15

reproducibility:
  seed: 42
  deterministic: true
